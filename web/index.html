<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>FotoOwl Gallery</title>
    <style id="expo-reset">
      html, body {
        height: 100%;
        margin: 0;
        padding: 0;
      }
      body {
        /* Allow the react-native-web ScrollView to scroll */
        overflow: hidden;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
        overflow: hidden;
      }
      /* Force react-native-web ScrollView containers to scroll */
      [data-focusable="true"],
      div[style*="overflow"] {
        -webkit-overflow-scrolling: touch;
      }
    </style>
    <!-- Scroll enabler: fixes react-native-web ScrollView on web -->
    <script>
      document.addEventListener('DOMContentLoaded', function() {
        // After app mounts, find all ScrollView containers and ensure they scroll
        setTimeout(function() {
          var scrollables = document.querySelectorAll('[style*="overflow"]');
          scrollables.forEach(function(el) {
            if (el.scrollHeight > el.clientHeight) {
              el.style.overflowY = 'scroll';
              el.style.webkitOverflowScrolling = 'touch';
            }
          });
          // Keep checking as navigation changes
          setInterval(function() {
            var scrollables = document.querySelectorAll('[style*="overflow"]');
            scrollables.forEach(function(el) {
              if (el.scrollHeight > el.clientHeight) {
                el.style.overflowY = 'scroll';
                el.style.webkitOverflowScrolling = 'touch';
              }
            });
          }, 1000);
        }, 500);
      });
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
