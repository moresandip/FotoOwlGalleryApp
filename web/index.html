<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>FotoOwl Gallery</title>
    <style id="expo-reset">
      /* Make body full-height but allow scrolling */
      html {
        height: 100%;
      }
      body {
        height: 100%;
        /* Override Expo default: allow scroll instead of hidden */
        overflow: auto;
        margin: 0;
        padding: 0;
      }
      /* Root element fills full height */
      #root {
        display: flex;
        min-height: 100%;
        flex: 1;
      }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
